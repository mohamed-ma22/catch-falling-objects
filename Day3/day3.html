<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Team</title>
    <style>
        :root {
            font-family: Arial, sans-serif;
            color: #1f2937;
            background: #f3f4f6;
        }

        body {
            max-width: 1100px;
            margin: 0 auto;
            padding: 32px 20px;
        }

        h1 { color: #0f766e; }
        section {
            background: white;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        form, .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: end;
        }

        label { display: grid; gap: 5px; font-weight: bold; }
        input, button {
            font: inherit;
            padding: 9px 10px;
            border: 1px solid #9ca3af;
            border-radius: 4px;
        }

        button { cursor: pointer; background: #0f766e; color: white; border-color: #0f766e; }
        button:hover { background: #115e59; }
        .danger { background: #b91c1c; border-color: #b91c1c; }
        #message { min-height: 24px; font-weight: bold; }
        .error { color: #b91c1c; }
        .success { color: #047857; }
        .table-wrapper { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 11px 8px; border-bottom: 1px solid #e5e7eb; }
        th { color: #0f766e; }
        .empty { color: #6b7280; text-align: center; }
    </style>
</head>
<body>
    <h1>Our Team</h1>

    <section>
        <h2>Add someone to the team</h2>
        <form id="employee-form">
            <label>Full name <input id="name" required placeholder="e.g. Sara Ali"></label>
            <label>Age <input id="age" type="number" min="1" required></label>
            <label>Salary <input id="salary" type="number" min="0" step="0.01" required></label>
            <label>Department <input id="department" required></label>
            <label>Joined on <input id="joining-date" type="date" required></label>
            <button type="submit">Add Employee</button>
        </form>
        <p id="message" role="status"></p>
    </section>

    <section>
        <h2>Find and manage people</h2>
        <div class="actions">
            <label>Find by name <input id="search-name" placeholder="Enter a name"></label>
            <button id="search-button" type="button">Search</button>
            <button id="show-all-button" type="button">Show All</button>
            <button id="sort-button" type="button">Sort by Salary</button>
            <button id="highest-button" type="button">Highest Salary</button>
            <button id="oldest-button" type="button">Oldest Employee</button>
            <button id="today-button" type="button">What's today's date?</button>
            <button id="clear-button" class="danger" type="button">Remove everyone</button>
        </div>
        <p id="result" role="status"></p>
    </section>

    <section>
        <h2>People on the team</h2>
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr><th>Name</th><th>Age</th><th>Salary</th><th>Department</th><th>Joined on</th><th>Years worked</th><th>Action</th></tr>
                </thead>
                <tbody id="employee-list"></tbody>
            </table>
        </div>
    </section>

    <script src="day3.js"></script>
</body>
</html>
