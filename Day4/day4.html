<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Little Shelf | Library</title>
	<style>
		:root { font-family: Georgia, serif; color: #20302b; background: #f4f0e8; }
		* { box-sizing: border-box; }
		body { max-width: 1050px; margin: 0 auto; padding: 44px 20px; }
		header { display: flex; justify-content: space-between; align-items: end; gap: 20px; margin-bottom: 34px; }
		h1 { margin: 0; color: #1b6157; font-size: clamp(2.4rem, 6vw, 4.8rem); line-height: .95; }
		.eyebrow { margin: 0 0 10px; color: #c15b3e; font: 700 .78rem/1.2 Arial, sans-serif; letter-spacing: .14em; text-transform: uppercase; }
		.subtitle { max-width: 270px; margin: 0; line-height: 1.5; color: #68766d; }
		.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; padding: 18px 0; border-top: 1px solid #cdd2c8; border-bottom: 1px solid #cdd2c8; }
		label { display: grid; gap: 6px; color: #68766d; font: 700 .75rem Arial, sans-serif; text-transform: uppercase; letter-spacing: .05em; }
		input, button { padding: 11px 13px; border: 1px solid #aebbb1; border-radius: 4px; font: 16px Georgia, serif; }
		input { background: #fffdf8; min-width: 210px; }
		button { cursor: pointer; color: #fffdf8; background: #1b6157; border-color: #1b6157; }
		button:hover { background: #12473f; }
		button.secondary { color: #1b6157; background: transparent; }
		.actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0 28px; }
		#result { min-height: 24px; margin: 0 0 18px; color: #c15b3e; font-weight: bold; }
		#book-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 12px; }
		.book { display: flex; align-items: center; gap: 14px; padding: 16px; background: #fffdf8; border-left: 5px solid #d9a441; box-shadow: 0 4px 14px #34483b12; }
		.book-cover { display: grid; place-items: center; flex: 0 0 48px; height: 62px; background: #1b6157; color: #f8dfaa; font-size: 1.8rem; }
		.book-info { flex: 1; min-width: 0; }
		h3 { margin: 0 0 5px; font-size: 1.05rem; }
		.book-info p { margin: 0 0 9px; color: #68766d; font-size: .9rem; }
		.book-info strong { color: #c15b3e; }
		.status { align-self: start; padding: 5px 7px; font: 700 .68rem Arial, sans-serif; text-transform: uppercase; }
		.available { color: #1b6157; background: #dcefe6; }
		.borrowed { color: #995039; background: #f5ddd3; }
		.empty { color: #68766d; }
		@media (max-width: 620px) { header { display: block; } .subtitle { margin-top: 15px; } input { width: 100%; } label { flex: 1 1 100%; } }
	</style>
</head>
<body>
	<header>
		<div><p class="eyebrow">A quiet place for good stories</p><h1>Little Shelf</h1></div>
		<p class="subtitle">Browse the collection, check what is on loan, and keep an eye on the prices.</p>
	</header>
	<section class="toolbar">
		<label>Search by title <input id="search-title" placeholder="Try &quot;Dune&quot;"></label>
		<button id="search-button" type="button">Search</button>
		<button id="show-all-button" class="secondary" type="button">Show all</button>
	</section>
	<div class="actions">
		<button id="available-button" type="button">Available</button>
		<button id="borrowed-button" type="button">Borrowed</button>
		<button id="average-button" class="secondary" type="button">Average price</button>
		<button id="expensive-button" class="secondary" type="button">Most expensive</button>
		<button id="cheap-button" class="secondary" type="button">Cheapest</button>
		<label>Discount % <input id="discount" type="number" min="0" max="100" placeholder="10"></label>
		<button id="discount-button" type="button">Apply discount</button>
	</div>
	<p id="result" role="status"></p>
	<main id="book-list" aria-live="polite"></main>
	<script src="day4.js"></script>
</body>
</html>
